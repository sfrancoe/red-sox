# Static site — no framework, no bundler. The build step just assembles the
# public files into _site/ so repo-only files (scripts, docs) are not served.

[build]
  command = "bash scripts/build_site.sh"
  publish = "_site"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Story pages and their code are small, and stale modules can render a newer data
# shape incorrectly after a deploy. Always fetch the current release.
[[headers]]
  for = "/stories/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
