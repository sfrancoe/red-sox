name: Refresh Red Sox game and standings data

on:
  schedule:
    # Every two hours keeps schedules, standings, and records useful without excess deploys.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Red Sox game data
        run: |
          python3 scripts/fetch_schedule.py
          python3 scripts/fetch_recent_game.py
          python3 scripts/fetch_standings.py

      - name: Fetch open player data
        run: python3 scripts/fetch_players.py --team redsox

      - name: Check player data
        run: |
          python3 scripts/test_open_players.py
          python3 scripts/test_players.py --team redsox

      - name: Show what changed
        run: git --no-pager diff --stat -- data/schedule.json data/recent-game.json data/standings.json data/players.json data/player-careers "ios/Hub Ball/Hub Ball/players.json" || true

      - name: Commit if game data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json data/recent-game.json data/standings.json data/players.json data/player-careers "ios/Hub Ball/Hub Ball/players.json"
          if git diff --cached --quiet; then
            echo "No game data changes — nothing to commit."
          else
            git commit -m "Refresh game and standings pages ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin main
            git push
            echo "Pushed refreshed game data."
          fi
