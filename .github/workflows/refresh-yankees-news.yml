name: Refresh Yankees newspapers

on:
  schedule:
    - cron: '9-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/fetch_yankees_news.py
      - name: Commit if headlines changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/yankees; then
            echo "No Yankees headline changes."
          else
            git add data/yankees
            git commit -m "Refresh Yankees newspapers ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin main
            git push
          fi
