name: Validate refresh reliability

on:
  pull_request:
    paths:
      - 'scripts/fetch_players.py'
      - 'scripts/fetch_mets_news.py'
      - 'scripts/http_refresh.py'
      - 'scripts/test_refresh_reliability.py'
      - 'scripts/refresh_pitching.py'
      - 'scripts/pitching_publication.py'
      - 'scripts/test_pitching_refresh.py'
      - 'scripts/fetch*pit*.py'
      - 'scripts/fetch_team_data.py'
      - 'scripts/fetch_team_leaders.py'
      - 'scripts/team_registry.py'
      - 'scripts/compare_feed_snapshots.py'
      - 'scripts/test_fetch_team_data.py'
      - 'scripts/test_postseason_schedules.py'
      - 'scripts/test_no_team_specific_fetchers.py'
      - 'scripts/fetch_team_news.py'
      - 'scripts/news_source_status.py'
      - 'scripts/test_fetch_team_news.py'
      - 'scripts/test_news_alert_publication.py'
      - '.github/news-status/expansion.json'
      - 'config/pitching-refresh.json'
      - '.github/workflows/refresh-*.yml'
      - '.github/workflows/validate-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_refresh_reliability.py'
      - name: Offline pitching policy, pacing and publication regressions
        run: python3 -m unittest discover -s scripts -p 'test_pitching_refresh.py'
      - run: python3 scripts/test_open_players.py
      - run: python3 scripts/test_fetch_team_news.py
      - name: Shared game-data fetcher, recaps and postseason schedules
        run: |
          python3 scripts/test_fetch_team_data.py
          python3 scripts/test_postseason_schedules.py
      - name: No new team-specific fetch scripts or workflows
        run: python3 scripts/test_no_team_specific_fetchers.py
      - name: Offline news status and publication transactions
        run: python3 scripts/test_news_alert_publication.py
  live:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RETROSHEET_CACHE_DIR: .cache/retrosheet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/retrosheet
          key: retrosheet-playerlogs-2025-v1
      - name: Check the Red Sox refresh and Retrosheet archive
        run: |
          python3 scripts/fetch_schedule.py
          python3 scripts/fetch_recent_game.py
          python3 scripts/fetch_standings.py
          python3 scripts/fetch_players.py --team redsox
          python3 scripts/test_players.py --team redsox
          python3 scripts/test_player_careers.py --team redsox
      - name: Check Mets newspapers
        if: '!cancelled()'
        run: python3 scripts/fetch_mets_news.py
      - name: Check pitching provider pacing across all shared-fetcher teams
        if: '!cancelled()'
        run: python3 scripts/fetch_team_data.py --section pitching --keep-going

  # Proves a migrated team's shared-fetcher output matches what its old
  # team-specific scripts last published. Report-only for value changes;
  # fails if any field the app could read went missing.
  shadow:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEAMS: yankees mets rays
    steps:
      - name: Check out published data on main (baseline)
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - name: Check out this change (candidate)
        uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the shared fetchers for the migrated teams
        working-directory: candidate
        run: |
          args=()
          for team in $TEAMS; do args+=(--team "$team"); done
          python3 scripts/fetch_team_data.py "${args[@]}" \
            --section schedule --section recent-game --section standings --section pitching \
            --keep-going
          python3 scripts/fetch_team_leaders.py "${args[@]}"
          python3 scripts/test_all_team_data.py "${args[@]}"
      - name: Compare with what the old scripts published
        run: |
          status=0
          for team in $TEAMS; do
            python3 candidate/scripts/compare_feed_snapshots.py \
              "baseline/data/$team" "candidate/data/$team" \
              schedule.json recent-game.json standings.json pitching.json seasons.json meta.json \
              --label "$team" >> shadow-report.md || status=1
          done
          cat shadow-report.md
          cat shadow-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
