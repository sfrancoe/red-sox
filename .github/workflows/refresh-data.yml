name: Refresh MLB data

# Pulls the latest game logs, then commits them if anything changed. Netlify
# watches the repo, so a commit here redeploys the site.
#
# Runs in the cloud, so it does not depend on any machine being awake.

on:
  schedule:
    # 11:00 UTC ≈ 7am ET — after the previous night's games are final.
    - cron: '0 11 * * *'
  workflow_dispatch:        # lets a human (or Claude) trigger a run on demand

permissions:
  contents: write

concurrency:
  group: site-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch seasons from MLB Stats API
        run: python3 scripts/fetch_seasons.py

      - name: Show what changed
        run: git --no-pager diff --stat -- data/seasons.json data/meta.json || true

      - name: Commit if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/seasons.json data/meta.json; then
            echo "No data changes — nothing to commit."
          else
            git add data/seasons.json data/meta.json
            git commit -m "Refresh MLB data ($(date -u +%Y-%m-%d))"
            git push
            echo "Pushed refreshed data."
          fi
