name: Refresh Yankees leaders

on:
  schedule:
    - cron: '25 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/fetch_yankees_seasons.py
      - name: Commit if leaders changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/yankees/seasons.json data/yankees/meta.json; then
            echo "No Yankees leader changes."
          else
            git add data/yankees/seasons.json data/yankees/meta.json
            git commit -m "Refresh Yankees leaders ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
